
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARNING - THE BEAST</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #ff0000;
    font-family: Consolas, monospace;
    overflow: hidden;
    height: 100vh;
}

.container {
    padding: 25px;
    text-align: center;
    height: 100vh;
    background:
    radial-gradient(circle, #260000 0%, #000 75%);
}

.warning {
    font-size: clamp(25px, 5vw, 48px);
    font-weight: bold;
    text-shadow: 0 0 15px red;
    margin-top: 35px;
    animation: flicker 1s infinite;
}

@keyframes flicker {
    0%, 100% {opacity: 1;}
    50% {opacity: .5;}
}

.skull {
    font-size: 75px;
    margin-top: 15px;
    filter: drop-shadow(0 0 15px red);
}

.subtitle {
    color: white;
    font-size: 17px;
    margin: 15px;
}

.progress-box {
    width: 90%;
    max-width: 600px;
    margin: 30px auto;
    border: 1px solid red;
    height: 24px;
    background: #170000;
}

.progress {
    height: 100%;
    width: 0%;
    background: red;
    box-shadow: 0 0 20px red;
    transition: width .3s;
}

.percent {
    font-size: 24px;
    color: white;
}

.terminal {
    width: 95%;
    max-width: 700px;
    height: 220px;
    overflow: hidden;
    margin: 25px auto;
    padding: 15px;
    text-align: right;
    border: 1px solid #650000;
    background: rgba(0,0,0,.9);
    color: #ff3333;
    font-size: 14px;
    box-shadow: 0 0 15px #500000;
}

.final {
    display: none;
    color: white;
    font-size: 26px;
    margin-top: 25px;
    text-shadow: 0 0 15px red;
}

button {
    background: darkred;
    border: 1px solid red;
    color: white;
    padding: 12px 30px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 10px;
}

.small {
    color: #555;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

<div class="skull">☠️</div>

<div class="warning">
تم تهكير جهازك بواسطة الوحش
</div>

<div class="subtitle">
⚠ SYSTEM BREACHED ⚠<br>
جاري تنفيذ المحاكاة...
</div>

<div class="progress-box">
<div class="progress" id="bar"></div>
</div>

<div class="percent" id="percent">0%</div>

<div class="terminal" id="terminal">
[ SYSTEM ] Initializing...<br>
[ WARNING ] Unauthorized access detected...
</div>

<div class="final" id="final">
☠️ انتهت اللعبة...<br>
أنت وقعت في مقلب الوحش! 😂
</div>

<br>

<button onclick="start()">إعادة تشغيل المحاكاة</button>

<p class="small">VISUAL SIMULATION ONLY</p>

</div>

<script>
let progress = 0;
let timer;

const messages = [
"[ SYSTEM ] Connecting to fake server...",
"[ WARNING ] Suspicious activity detected...",
"[ SYSTEM ] Scanning simulated environment...",
"[ DATA ] Loading virtual files...",
"[ SECURITY ] Firewall simulation started...",
"[ ALERT ] System under attack...",
"[ SYSTEM ] Encrypting fake data...",
"[ WARNING ] Access level: CRITICAL",
"[ DATA ] Loading virtual database...",
"[ SYSTEM ] Simulation running...",
"[ ALERT ] THE BEAST HAS ARRIVED...",
"[ SYSTEM ] Final stage loading..."
];

function start() {
    clearInterval(timer);

    progress = 0;

    document.getElementById("bar").style.width = "0%";
    document.getElementById("percent").innerText = "0%";
    document.getElementById("final").style.display = "none";
    document.getElementById("terminal").innerHTML =
    "[ SYSTEM ] Initializing...<br>";

    let index = 0;

    timer = setInterval(() => {
        progress += Math.floor(Math.random() * 5) + 2;

        if(progress > 100) progress = 100;

        document.getElementById("bar").style.width =
        progress + "%";

        document.getElementById("percent").innerText =
        progress + "%";

        if(index < messages.length) {
            document.getElementById("terminal").innerHTML +=
            messages[index] + "<br>";

            index++;
        }

        let terminal = document.getElementById("terminal");
        terminal.scrollTop = terminal.scrollHeight;

        if(progress >= 100) {
            clearInterval(timer);

            document.getElementById("final").style.display =
            "block";

            document.querySelector(".subtitle").innerHTML =
            "SYSTEM SIMULATION COMPLETED";
        }

    }, 450);
}

start();
</script>

</body>
</html>
